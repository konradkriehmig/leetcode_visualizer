<!DOCTYPE html>
<html lang="en">
<head>

<title>88. Merge Sorted Array</title>

<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --cp-bg: #000000;
    --cp-bg-elevated: #000000;
    --cp-surface: #0d0d0d;
    --cp-surface-soft: #141414;
    --cp-border: #252525;
    --cp-border-strong: #3a3a3a;
    --cp-text: #f2f2f2;
    --cp-text-muted: #a7a7a7;
    --cp-text-soft: #7c7c7c;
    --cp-accent: #ffffff;
    --cp-accent-hover: #d9d9d9;
    --cp-accent-soft: rgba(255, 255, 255, 0.12);
    --cp-accent-fg: #000000;
    --cp-success: #9ae6b4;
    --cp-danger: #ff8f8f;
    --cp-warning: #ffe08a;
    --cp-link: #f2f2f2;
    --cp-shadow: none;
    --cp-overlay: rgba(0, 0, 0, 0.8);
    --cp-panel: transparent;
    --cp-panel-strong: transparent;
    --cp-sheen: rgba(255, 255, 255, 0.02);
    --cp-highlight: rgba(255, 255, 255, 0.16);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #000000;
    --cp-bg-elevated: #000000;
    --cp-surface: #0d0d0d;
    --cp-surface-soft: #141414;
    --cp-border: #252525;
    --cp-border-strong: #3a3a3a;
    --cp-text: #f2f2f2;
    --cp-text-muted: #a7a7a7;
    --cp-text-soft: #7c7c7c;
    --cp-accent: #ffffff;
    --cp-accent-hover: #d9d9d9;
    --cp-accent-soft: rgba(255, 255, 255, 0.12);
    --cp-accent-fg: #000000;
    --cp-success: #9ae6b4;
    --cp-danger: #ff8f8f;
    --cp-warning: #ffe08a;
    --cp-link: #f2f2f2;
    --cp-shadow: none;
    --cp-overlay: rgba(0, 0, 0, 0.8);
    --cp-panel: transparent;
    --cp-panel-strong: transparent;
    --cp-sheen: rgba(255, 255, 255, 0.02);
    --cp-highlight: rgba(255, 255, 255, 0.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--cp-bg);
    color: var(--cp-text);
    font-family: "Titillium Web", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 22px;
    padding: 28px 20px 36px;
    min-height: 100vh;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 0.08em;
  }
  h1 .num { color: inherit; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    align-items: center;
    margin-top: 2px;
    width: 100%;
    max-width: 780px;
    margin-inline: auto;
  }
  .tabs-prefix {
    display: inline-flex;
    align-items: center;
    font: 600 0.95rem inherit;
    color: var(--cp-text);
    padding: 10px 12px;
    user-select: none;
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font: 600 0.95rem inherit;
    color: var(--cp-text-muted);
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 10px 12px;
    user-select: none;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .tab:hover { color: var(--cp-text); }
  .tab.active { color: var(--cp-text); border-color: var(--cp-text); }
  .tab .x { border: none; background: none; color: inherit; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; }
  .tab .x:hover { color: var(--cp-text); }

  .tab.add-trigger {
    justify-content: center;
    width: 38px;
    min-width: 38px;
    padding: 10px 0;
    font-size: 1.1rem;
    border: 1px solid var(--cp-border);
    border-bottom-color: var(--cp-border);
  }
  .tab.add-trigger:hover { border-color: var(--cp-text); }
  .tab.add-trigger.active { border-color: var(--cp-text); background: var(--cp-surface-soft); }

  .add-pop {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-top: 2px;
  }
  .add-pop[hidden] { display: none; }

  .add { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .add input {
    width: min(420px, 88vw);
    font: 0.9rem Consolas, "Courier New", Courier, monospace;
    color: var(--cp-text);
    background: transparent;
    border: 1px solid var(--cp-border);
    padding: 9px 12px;
  }
  .add input.nums-input { width: min(240px, 58vw); }
  .add input:focus { outline: none; border-color: var(--cp-text); }
  .add button {
    font: 600 0.9rem inherit;
    cursor: pointer;
    color: var(--cp-text);
    background: transparent;
    border: 1px solid var(--cp-border);
    padding: 9px 18px;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .add button:hover { border-color: var(--cp-text); color: var(--cp-text); background: var(--cp-surface-soft); }
  .hint { font-size: 0.8rem; color: var(--cp-danger); min-height: 16px; text-align: center; }

  .viz-stack {
    width: 100%;
    max-width: 780px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    transform: none;
    position: relative;
  }

  .merge-board {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }
  .arr-block { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .arr-label {
    font: 600 0.9rem Consolas, "Courier New", Courier, monospace;
    color: var(--cp-text-soft);
    letter-spacing: 0.05em;
  }

  .board {
    background: transparent;
    border: none;
    padding: 10px 0 0;
    width: 100%;
    max-width: 780px;
    margin-inline: auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .array-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
    justify-content: center;
    min-height: 0;
    width: 100%;
  }
  .cell { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; position: relative; }
  .ptr { height: 30px; display: flex; align-items: center; justify-content: center; }
  .ptr-chip {
    font: 700 1.2rem Consolas, "Courier New", Courier, monospace;
    line-height: 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border: none;
    background: transparent;
    color: var(--cp-text-soft);
  }
  .ptr-chip.p1 { color: var(--cp-text); }
  .ptr-chip.p2 { color: var(--cp-text); }
  .ptr-chip.p { color: var(--cp-text); }

  .box {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--cp-border);
    background: transparent;
    color: var(--cp-text-muted);
    font: 700 1.35rem Consolas, "Courier New", Courier, monospace;
    transition: border-color 0.12s linear, color 0.12s linear, background-color 0.12s linear;
  }
  .box.comparing { color: var(--cp-text); }
  .box.kept { }
  .box.writing { }
  .box.consumed { }
  .idx { margin-bottom: 4px; font: 700 1.35rem Consolas, "Courier New", Courier, monospace; color: var(--cp-text-soft); }
  .cell.ghost .box { }
  .empty-note { color: var(--cp-text-muted); font-family: Consolas, monospace; padding: 22px 4px; }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 28px;
    margin: 0;
  }
  .controls button {
    font: 600 0.92rem inherit;
    cursor: pointer;
    padding: 11px 18px;
    border: 1px solid var(--cp-border);
    background: transparent;
    color: var(--cp-text);
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .controls button:hover:not(:disabled) { border-color: var(--cp-text); color: var(--cp-text); background: var(--cp-surface-soft); }
  .controls .run {
    background: transparent;
    border-color: var(--cp-border);
    color: var(--cp-text);
  }
  .controls .run:hover:not(:disabled) { background: var(--cp-surface-soft); border-color: var(--cp-text); color: var(--cp-text); }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }

  .done-reset {
    font: 600 0.92rem inherit;
    cursor: pointer;
    padding: 11px 14px;
    min-width: 44px;
    border: 1px solid var(--cp-border);
    background: transparent;
    color: var(--cp-text);
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .done-reset:hover { border-color: var(--cp-text); color: var(--cp-text); background: var(--cp-surface-soft); }

  @media (max-width: 640px) {
    body { justify-content: flex-start; padding: 24px 12px 28px; gap: 18px; }
    .viz-stack { flex: 0 0 auto; transform: none; }
    .board { min-height: 0; padding: 8px 0 0; }
    .merge-board { gap: 20px; }
    .controls {
      position: static;
      left: auto;
      transform: none;
      bottom: auto;
      margin-top: 40px;
      width: 100%;
      max-width: 780px;
      flex-wrap: wrap;
    }
    .array-row { gap: 8px; }
    .box { width: 50px; height: 50px; font-size: 1.1rem; }
    .ptr { height: 24px; }
    .ptr-chip { font-size: 1rem; }
    .idx { font-size: 1.1rem; }
    .controls button { padding: 10px 14px; font-size: 0.92rem; }
    .done-reset { min-width: 40px; }
  }
</style>

</head>
<body>
  <h1><span class="num">88.</span> Merge Sorted Array</h1>

  <div class="tabs" id="tabs"></div>

  <div class="add-pop" id="addPop" hidden>
    <div class="add">
      <input id="n1Input" class="nums-input" type="text" placeholder="nums1" autocomplete="off" />
      <input id="n2Input" class="nums-input" type="text" placeholder="nums2" autocomplete="off" />
      <button id="addBtn">Add</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="viz-stack">
    <div class="merge-board">
      <div class="arr-block">
        <div class="array-row" id="nums2Row"></div>
      </div>
      <div class="arr-block">
        <div class="array-row" id="nums1Row"></div>
      </div>
    </div>

    <div class="controls">
      <button class="run" id="runBtn">Run</button>
      <button class="done-reset" id="doneResetBtn" aria-label="Retry" title="Retry">&#8635;</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "lc88_custom_v1";
  var SPEED_MS = 650;

  var cases = [
    { nums1: [1, 2, 3], nums2: [2, 5, 6], removable: false },
    { nums1: [4, 5, 6], nums2: [1, 2, 3], removable: false },
    { nums1: [1], nums2: [], removable: false },
    { nums1: [], nums2: [1], removable: false }
  ].concat(loadCustom());

  var frames = [];
  var current = 0;
  var activeCaseIdx = 0;
  var running = false;
  var timer = null;

  var tabs = document.getElementById("tabs");
  var nums1Row = document.getElementById("nums1Row");
  var nums2Row = document.getElementById("nums2Row");
  var runBtn = document.getElementById("runBtn");
  var doneResetBtn = document.getElementById("doneResetBtn");
  var addPop = document.getElementById("addPop");
  var n1Input = document.getElementById("n1Input");
  var n2Input = document.getElementById("n2Input");
  var addBtn = document.getElementById("addBtn");
  var hint = document.getElementById("hint");
  var addOpen = false;

  function setDoneResetVisible(show) {
    doneResetBtn.classList.remove("is-hidden");
  }

  function setAddOpen(open, skipRender) {
    addOpen = !!open;
    addPop.hidden = !addOpen;
    if (addOpen) {
      n1Input.value = "";
      n2Input.value = "";
      setHint("", false);
      setTimeout(function () { n1Input.focus(); }, 0);
    }
    if (!skipRender) renderTabs();
  }

  function toggleAddOpen() {
    setAddOpen(!addOpen);
  }

  function zeros(count) {
    var z = [];
    for (var i = 0; i < count; i++) z.push(0);
    return z;
  }

  function buildFrames(nums1valid, nums2) {
    var m = nums1valid.length, n = nums2.length;
    var a = nums1valid.concat(zeros(n));
    var b = nums2.slice();
    var out = [];
    var p1 = m - 1, p2 = n - 1, p = m + n - 1;

    function snap(extra) {
      var f = {
        a: a.slice(), b: b.slice(), m: m, n: n,
        p1: p1, p2: p2, p: p,
        compare1: null, compare2: null,
        writeIndex: null, srcArr: null, srcIndex: null, done: false
      };
      for (var key in extra) f[key] = extra[key];
      return f;
    }

    out.push(snap({}));
    while (p2 >= 0) {
      var useNums1 = (p1 >= 0 && a[p1] > b[p2]);
      out.push(snap({ compare1: (p1 >= 0 ? p1 : null), compare2: p2 }));
      if (useNums1) {
        a[p] = a[p1];
        out.push(snap({ writeIndex: p, srcArr: "nums1", srcIndex: p1 }));
        p1--;
      } else {
        a[p] = b[p2];
        out.push(snap({ writeIndex: p, srcArr: "nums2", srcIndex: p2 }));
        p2--;
      }
      p--;
    }
    return out;
  }

  function render() {
    var f = frames[current];
    renderRow(nums2Row, f, "nums2");
    renderRow(nums1Row, f, "nums1");
  }

  function renderRow(rowEl, f, which) {
    rowEl.innerHTML = "";
    var arr = which === "nums1" ? f.a : f.b;
    var len = arr.length;
    if (len === 0) {
      var note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "[ ]  empty";
      rowEl.appendChild(note);
      return;
    }
    for (var idx = 0; idx < len; idx++) rowEl.appendChild(makeCell(f, idx, which));
  }

  function makeCell(f, idx, which) {
    var cell = document.createElement("div");
    cell.className = "cell";
    var arr = which === "nums1" ? f.a : f.b;

    var isPlaced = false, isGhost = false, isConsumed = false;
    if (which === "nums1") {
      var isWriting = f.writeIndex === idx;
      isPlaced = f.done || idx > f.p;
      isGhost = !isPlaced && !isWriting && idx >= f.m;
    } else {
      isConsumed = f.done || idx > f.p2;
    }
    if (isGhost) cell.classList.add("ghost");

    var index = document.createElement("div");
    index.className = "idx";
    index.textContent = idx;
    cell.appendChild(index);

    var box = document.createElement("div");
    box.className = "box";
    if (which === "nums1") {
      if (isPlaced) box.classList.add("kept");
      if (!f.done && f.compare1 === idx) box.classList.add("comparing");
      if (!f.done && f.srcArr === "nums1" && f.srcIndex === idx) box.classList.add("comparing");
      if (f.writeIndex === idx) box.classList.add("writing");
      box.textContent = isGhost ? "" : arr[idx];
    } else {
      if (isConsumed) box.classList.add("consumed");
      if (!f.done && f.compare2 === idx) box.classList.add("comparing");
      if (!f.done && f.srcArr === "nums2" && f.srcIndex === idx) box.classList.add("comparing");
      box.textContent = arr[idx];
    }
    cell.appendChild(box);

    if (which === "nums1") {
      var rowP1 = document.createElement("div");
      rowP1.className = "ptr";
      if (f.p1 === idx && f.p1 >= 0) rowP1.innerHTML = '<span class="ptr-chip p1">p1</span>';
      cell.appendChild(rowP1);

      var rowP = document.createElement("div");
      rowP.className = "ptr";
      if (f.p === idx && f.p >= 0) rowP.innerHTML = '<span class="ptr-chip p">p</span>';
      cell.appendChild(rowP);
    } else {
      var rowP2 = document.createElement("div");
      rowP2.className = "ptr";
      if (f.p2 === idx && f.p2 >= 0) rowP2.innerHTML = '<span class="ptr-chip p2">p2</span>';
      cell.appendChild(rowP2);
    }

    return cell;
  }

  function next() {
    if (running) return;
    if (current < frames.length - 1) {
      current++;
      render();
    }
    if (current >= frames.length - 1) setDoneResetVisible(true);
  }

  function shouldIgnoreScreenAdvanceClick(target) {
    return !!target.closest("button, input, .tab, .tabs, .add-pop, .add, .x");
  }
  function reset() { stopRun(false); current = 0; render(); }

  function stopRun(showDoneReset) {
    running = false;
    clearInterval(timer);
    timer = null;
    runBtn.disabled = false;
    setDoneResetVisible(!!showDoneReset);
  }
  function runAlgo() {
    if (running) return;
    setDoneResetVisible(false);
    if (current >= frames.length - 1) current = 0;
    running = true;
    runBtn.disabled = true;
    render();
    timer = setInterval(function () {
      if (current >= frames.length - 1) { stopRun(true); render(); return; }
      current++;
      render();
    }, SPEED_MS);
  }

  function loadCase(i) {
    stopRun(false);
    setAddOpen(false, true);
    activeCaseIdx = i;
    frames = buildFrames(cases[i].nums1, cases[i].nums2);
    current = 0;
    renderTabs();
    render();
  }

  function renderTabs() {
    tabs.innerHTML = "";

    var prefix = document.createElement("span");
    prefix.className = "tabs-prefix";
    prefix.textContent = "Test case";
    tabs.appendChild(prefix);

    cases.forEach(function (c, i) {
      var tab = document.createElement("div");
      tab.className = "tab" + (i === activeCaseIdx ? " active" : "");
      tab.setAttribute("role", "button");
      tab.tabIndex = 0;

      var label = document.createElement("span");
      label.textContent = String(i + 1);
      tab.appendChild(label);

      if (c.removable) {
        var x = document.createElement("button");
        x.className = "x";
        x.innerHTML = "&times;";
        x.title = "Remove";
        x.addEventListener("click", function (e) { e.stopPropagation(); removeCase(i); });
        tab.appendChild(x);
      }

      tab.addEventListener("click", function () { loadCase(i); });
      tab.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loadCase(i); }
      });
      tabs.appendChild(tab);
    });

    var addTrigger = document.createElement("button");
    addTrigger.type = "button";
    addTrigger.className = "tab add-trigger" + (addOpen ? " active" : "");
    addTrigger.setAttribute("aria-label", "Add test case");
    addTrigger.textContent = "+";
    addTrigger.addEventListener("click", function () { toggleAddOpen(); });
    tabs.appendChild(addTrigger);
  }

  function numAsc(a, b) { return a - b; }

  function parseList(raw) {
    if (raw === "") return [];
    var tokens = raw.replace(/[\[\]]/g, "").split(/[,\s]+/).filter(function (t) { return t !== ""; });
    var nums = [];
    for (var j = 0; j < tokens.length; j++) {
      if (!/^-?\d+$/.test(tokens[j])) { setHint('"' + tokens[j] + '" is not a whole number.', true); return null; }
      nums.push(parseInt(tokens[j], 10));
    }
    return nums;
  }

  function addCase() {
    var nums1 = parseList(n1Input.value.trim());
    if (nums1 === null) return;
    var nums2 = parseList(n2Input.value.trim());
    if (nums2 === null) return;
    if (nums1.length + nums2.length === 0) { setHint("Enter at least one number across nums1 and nums2.", true); return; }
    if (nums1.length + nums2.length > 60) { setHint("Keep the combined length to 60 or fewer.", true); return; }

    var sorted1 = isSorted(nums1), sorted2 = isSorted(nums2);
    if (!sorted1) nums1.sort(numAsc);
    if (!sorted2) nums2.sort(numAsc);

    cases.push({ nums1: nums1, nums2: nums2, removable: true });
    saveCustom();
    setAddOpen(false, true);
    loadCase(cases.length - 1);
    setHint((!sorted1 || !sorted2) ? "Sorted inputs ascending." : "", false);
  }

  function removeCase(i) {
    var wasActive = i === activeCaseIdx;
    cases.splice(i, 1);
    saveCustom();
    if (activeCaseIdx >= cases.length) activeCaseIdx = cases.length - 1;
    else if (i < activeCaseIdx) activeCaseIdx--;
    if (wasActive) loadCase(activeCaseIdx);
    else renderTabs();
  }

  function isSorted(a) {
    for (var i = 1; i < a.length; i++) if (a[i] < a[i - 1]) return false;
    return true;
  }
  function setHint(msg, isError) {
    hint.textContent = msg;
    hint.style.color = isError ? "var(--cp-danger)" : "var(--cp-text-muted)";
  }

  function isNum(x) { return typeof x === "number"; }

  function loadCustom() {
    try {
      var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(function (o) {
          return o && Array.isArray(o.nums1) && Array.isArray(o.nums2) &&
            o.nums1.every(isNum) && o.nums2.every(isNum);
        })
        .map(function (o) { return { nums1: o.nums1, nums2: o.nums2, removable: true }; });
    } catch (e) { return []; }
  }
  function saveCustom() {
    try {
      var custom = cases.filter(function (c) { return c.removable; }).map(function (c) { return { nums1: c.nums1, nums2: c.nums2 }; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(custom));
    } catch (e) {}
  }

  runBtn.addEventListener("click", runAlgo);
  doneResetBtn.addEventListener("click", reset);
  addBtn.addEventListener("click", addCase);
  n1Input.addEventListener("keydown", function (e) { if (e.key === "Enter") addCase(); });
  n2Input.addEventListener("keydown", function (e) { if (e.key === "Enter") addCase(); });
  document.addEventListener("click", function (e) {
    if (shouldIgnoreScreenAdvanceClick(e.target)) return;
    next();
  });

  loadCase(0);
})();
</script>
</body>
</html>
