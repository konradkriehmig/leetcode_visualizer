<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>26. Remove Duplicates from Sorted Array</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300&display=swap" rel="stylesheet" />
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --cp-bg: #000000;
    --cp-bg-elevated: #000000;
    --cp-surface: #0d0d0d;
    --cp-surface-soft: #141414;
    --cp-border: #252525;
    --cp-border-strong: #3a3a3a;
    --cp-text: #f2f2f2;
    --cp-text-muted: #a7a7a7;
    --cp-text-soft: #7c7c7c;
    --cp-accent: #ffffff;
    --cp-accent-hover: #d9d9d9;
    --cp-accent-soft: rgba(255, 255, 255, 0.12);
    --cp-accent-fg: #000000;
    --cp-success: #9ae6b4;
    --cp-danger: #ff8f8f;
    --cp-warning: #ffe08a;
    --cp-link: #f2f2f2;
    --cp-shadow: none;
    --cp-overlay: rgba(0, 0, 0, 0.8);
    --cp-panel: transparent;
    --cp-panel-strong: transparent;
    --cp-sheen: rgba(255, 255, 255, 0.02);
    --cp-highlight: rgba(255, 255, 255, 0.16);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #000000;
    --cp-bg-elevated: #000000;
    --cp-surface: #0d0d0d;
    --cp-surface-soft: #141414;
    --cp-border: #252525;
    --cp-border-strong: #3a3a3a;
    --cp-text: #f2f2f2;
    --cp-text-muted: #a7a7a7;
    --cp-text-soft: #7c7c7c;
    --cp-accent: #ffffff;
    --cp-accent-hover: #d9d9d9;
    --cp-accent-soft: rgba(255, 255, 255, 0.12);
    --cp-accent-fg: #000000;
    --cp-success: #9ae6b4;
    --cp-danger: #ff8f8f;
    --cp-warning: #ffe08a;
    --cp-link: #f2f2f2;
    --cp-shadow: none;
    --cp-overlay: rgba(0, 0, 0, 0.8);
    --cp-panel: transparent;
    --cp-panel-strong: transparent;
    --cp-sheen: rgba(255, 255, 255, 0.02);
    --cp-highlight: rgba(255, 255, 255, 0.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--cp-bg);
    color: var(--cp-text);
    font-family: "Titillium Web", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 22px;
    padding: 28px 20px 36px;
    min-height: 100vh;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 0.08em;
  }
  h1 .num { color: inherit; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    align-items: center;
    margin-top: 2px;
    width: 100%;
    max-width: 780px;
    margin-inline: auto;
  }
  .tabs-prefix {
    display: inline-flex;
    align-items: center;
    font: 600 0.95rem inherit;
    color: var(--cp-text);
    padding: 10px 12px;
    user-select: none;
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font: 600 0.95rem inherit;
    color: var(--cp-text-muted);
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 10px 12px;
    user-select: none;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .tab:hover { color: var(--cp-text); }
  .tab.active { color: var(--cp-text); border-color: var(--cp-text); }
  .tab .x { border: none; background: none; color: inherit; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; }
  .tab .x:hover { color: var(--cp-text); }

  .tab.add-trigger {
    justify-content: center;
    width: 38px;
    min-width: 38px;
    padding: 10px 0;
    font-size: 1.1rem;
    border: 1px solid var(--cp-border);
    border-bottom-color: var(--cp-border);
  }
  .tab.add-trigger:hover { border-color: var(--cp-text); }
  .tab.add-trigger.active { border-color: var(--cp-text); background: var(--cp-surface-soft); }

  .add-pop {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-top: 2px;
  }
  .add-pop[hidden] { display: none; }

  .add { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .add input {
    width: min(420px, 88vw);
    font: 0.9rem Consolas, "Courier New", Courier, monospace;
    color: var(--cp-text);
    background: transparent;
    border: 1px solid var(--cp-border);
    padding: 9px 12px;
  }
  .add input:focus { outline: none; border-color: var(--cp-text); }
  .add button {
    font: 600 0.9rem inherit;
    cursor: pointer;
    color: var(--cp-text);
    background: transparent;
    border: 1px solid var(--cp-border);
    padding: 9px 18px;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .add button:hover { border-color: var(--cp-text); color: var(--cp-text); background: var(--cp-surface-soft); }
  .hint { font-size: 0.8rem; color: var(--cp-danger); min-height: 16px; text-align: center; }

  .viz-stack {
    width: 100%;
    max-width: 780px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    transform: none;
    position: relative;
  }

  .board {
    background: transparent;
    border: none;
    padding: 10px 0 0;
    width: 100%;
    max-width: 780px;
    margin-inline: auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .array-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
    justify-content: center;
    min-height: 150px;
    width: 100%;
  }
  .cell { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; position: relative; }
  .past-marker {
    position: absolute;
    left: calc(100% + 10px);
    top: 0;
    width: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    white-space: nowrap;
    pointer-events: none;
  }
  .end-gap { height: 60px; width: 100%; }
  .idx-spacer { visibility: hidden; }
  .ptr { height: 30px; display: flex; align-items: center; justify-content: center; }
  .ptr-chip {
    font: 700 1.35rem Consolas, "Courier New", Courier, monospace;
    line-height: 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border: none;
    background: transparent;
    color: var(--cp-text-soft);
  }
  .ptr-chip.k { color: var(--cp-text); }
  .ptr-chip.i { color: var(--cp-text); }

  .box {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--cp-border);
    background: transparent;
    color: var(--cp-text-muted);
    font: 700 1.35rem Consolas, "Courier New", Courier, monospace;
    transition: border-color 0.12s linear, color 0.12s linear, background-color 0.12s linear;
  }
  .box.comparing { color: var(--cp-text); }
  .box.kept { }
  .box.writing { }
  .box.skipped {
    color: var(--cp-text-soft);
    border-style: dashed;
    transition: none;
  }
  .idx { margin-bottom: 4px; font: 700 1.35rem Consolas, "Courier New", Courier, monospace; color: var(--cp-text-soft); }
  .cell.ghost .box { }
  .empty-note { color: var(--cp-text-muted); font-family: Consolas, monospace; padding: 36px 4px; }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 28px;
    margin: 0;
  }
  .controls button {
    font: 600 0.92rem inherit;
    cursor: pointer;
    padding: 11px 18px;
    border: 1px solid var(--cp-border);
    background: transparent;
    color: var(--cp-text);
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .controls button:hover:not(:disabled) { border-color: var(--cp-text); color: var(--cp-text); background: var(--cp-surface-soft); }
  .controls .run {
    background: transparent;
    border-color: var(--cp-border);
    color: var(--cp-text);
  }
  .controls .run:hover:not(:disabled) { background: var(--cp-surface-soft); border-color: var(--cp-text); color: var(--cp-text); }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }

  .done-reset {
    font: 600 0.92rem inherit;
    cursor: pointer;
    padding: 11px 14px;
    min-width: 44px;
    border: 1px solid var(--cp-border);
    background: transparent;
    color: var(--cp-text);
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .done-reset:hover { border-color: var(--cp-text); color: var(--cp-text); background: var(--cp-surface-soft); }

  @media (max-width: 640px) {
    body { justify-content: flex-start; padding: 24px 12px 28px; gap: 18px; }
    .viz-stack { flex: 0 0 auto; transform: none; }
    .board { min-height: 0; padding: 8px 0 0; }
    .controls {
      position: static;
      left: auto;
      transform: none;
      bottom: auto;
      margin-top: 40px;
      width: 100%;
      max-width: 780px;
      flex-wrap: wrap;
    }
    .array-row { gap: 8px; min-height: 130px; }
    .box { width: 50px; height: 50px; font-size: 1.1rem; }
    .past-marker { left: calc(100% + 8px); width: 50px; }
    .end-gap { height: 50px; width: 100%; }
    .ptr { height: 24px; }
    .ptr-chip { font-size: 1.1rem; }
    .idx { font-size: 1.1rem; }
    .controls button { padding: 10px 14px; font-size: 0.92rem; }
    .done-reset { min-width: 40px; }
  }
</style>
<link rel="stylesheet" href="common.css" />
</head>
<body>
  <h1><span class="num">26.</span> Remove Duplicates from Sorted Array</h1>

  <div class="tabs" id="tabs"></div>

  <div class="add-pop" id="addPop" hidden>
    <div class="add">
      <input id="tcInput" type="text" placeholder="array" autocomplete="off" />
      <button id="addBtn">Add</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="viz-stack">
    <div class="board">
      <div class="array-row" id="arrayRow"></div>
    </div>

    <div class="controls">
      <button class="run" id="runBtn">Run</button>
      <button class="done-reset" id="doneResetBtn" aria-label="Retry" title="Retry">&#8635;</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "lc26_custom_v2";
  var SPEED_MS = 650;

  var cases = [
    { nums: [1, 1, 2], removable: false },
    { nums: [0, 0, 1, 1, 1, 2, 2, 3, 3, 4], removable: false },
    { nums: [1, 2, 3], removable: false },
    { nums: [2, 2, 2, 2], removable: false }
  ].concat(loadCustom());

  var frames = [];
  var current = 0;
  var activeCaseIdx = 0;
  var running = false;
  var timer = null;

  var tabs = document.getElementById("tabs");
  var arrayRow = document.getElementById("arrayRow");
  var runBtn = document.getElementById("runBtn");
  var doneResetBtn = document.getElementById("doneResetBtn");
  var addPop = document.getElementById("addPop");
  var tcInput = document.getElementById("tcInput");
  var addBtn = document.getElementById("addBtn");
  var hint = document.getElementById("hint");
  var addOpen = false;

  function setDoneResetVisible(show) {
    doneResetBtn.classList.remove("is-hidden");
  }

  function setAddOpen(open, skipRender) {
    addOpen = !!open;
    addPop.hidden = !addOpen;
    if (addOpen) {
      tcInput.value = "";
      setHint("", false);
      setTimeout(function () { tcInput.focus(); }, 0);
    }
    if (!skipRender) renderTabs();
  }

  function toggleAddOpen() {
    setAddOpen(!addOpen);
  }

  function buildFrames(input) {
    var arr = input.slice(), n = arr.length, out = [];
    if (n === 0) {
      out.push({ arr: [], readPointer: null, writePointer: 0, keptCount: 0, compare: null, writeIndex: null, skipIndex: null });
      return out;
    }
    out.push({ arr: arr.slice(), readPointer: 0, writePointer: 0, keptCount: 0, compare: null, writeIndex: null, skipIndex: null });
    var k = 0;
    for (var i = 0; i < n; i++) {
      var cmp = k === 0 ? [i] : [i, k - 1];
      out.push({ arr: arr.slice(), readPointer: i, writePointer: k, keptCount: k, compare: cmp, writeIndex: null, skipIndex: null });
      if (k === 0 || arr[i] !== arr[k - 1]) {
        arr[k] = arr[i];
        out.push({ arr: arr.slice(), readPointer: i, writePointer: k, keptCount: k + 1, compare: null, writeIndex: k, skipIndex: null });
        k++;
      } else {
        out.push({ arr: arr.slice(), readPointer: i, writePointer: k, keptCount: k, compare: null, writeIndex: null, skipIndex: i });
      }
    }
    out.push({ arr: arr.slice(), readPointer: n, writePointer: k, keptCount: k, compare: null, writeIndex: null, skipIndex: null });
    return out;
  }

  function render() {
    var f = frames[current];
    arrayRow.innerHTML = "";
    var n = f.arr.length;
    if (n === 0) {
      var note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "[ ]  empty array";
      arrayRow.appendChild(note);
    }
    for (var idx = 0; idx < n; idx++) arrayRow.appendChild(makeCell(f, idx));
  }

  function makeCell(f, idx) {
    var cell = document.createElement("div");
    cell.className = "cell";

    var index = document.createElement("div");
    index.className = "idx";
    index.textContent = idx;
    cell.appendChild(index);

    var box = document.createElement("div");
    box.className = "box";
    if (idx < f.keptCount) box.classList.add("kept");
    if (f.compare && (f.compare[0] === idx || f.compare[1] === idx)) box.classList.add("comparing");
    if (f.writeIndex === idx) box.classList.add("writing");
    if (f.skipIndex === idx) box.classList.add("skipped");
    box.textContent = f.arr[idx];
    cell.appendChild(box);

    var bottomI = document.createElement("div");
    bottomI.className = "ptr";
    if (f.readPointer === idx) bottomI.innerHTML = '<span class="ptr-chip i">i</span>';
    cell.appendChild(bottomI);

    var bottomK = document.createElement("div");
    bottomK.className = "ptr";
    if (f.writePointer === idx) bottomK.innerHTML = '<span class="ptr-chip k">k</span>';
    cell.appendChild(bottomK);

    var endIdx = Math.max(
      f.writePointer,
      f.readPointer === null || typeof f.readPointer === "undefined" ? -1 : f.readPointer
    );
    if (idx === f.arr.length - 1 && endIdx >= f.arr.length) {
      cell.appendChild(makePastEndMarker(f, endIdx));
    }

    return cell;
  }

  function makePastEndMarker(f, endIdx) {
    var cell = document.createElement("div");
    cell.className = "past-marker";
    var indexSpacer = document.createElement("div");
    indexSpacer.className = "idx idx-spacer";
    indexSpacer.textContent = "0";
    cell.appendChild(indexSpacer);
    var gap = document.createElement("div");
    gap.className = "end-gap";
    cell.appendChild(gap);
    var bottomI = document.createElement("div");
    bottomI.className = "ptr";
    if (f.readPointer === endIdx) bottomI.innerHTML = '<span class="ptr-chip i">i</span>';
    cell.appendChild(bottomI);
    var bottomK = document.createElement("div");
    bottomK.className = "ptr";
    if (f.writePointer === endIdx) bottomK.innerHTML = '<span class="ptr-chip k">k</span>';
    cell.appendChild(bottomK);
    return cell;
  }

  function next() {
    if (running) return;
    if (current < frames.length - 1) {
      current++;
      render();
    }
    if (current >= frames.length - 1) setDoneResetVisible(true);
  }

  function shouldIgnoreScreenAdvanceClick(target) {
    return !!target.closest("button, input, .tab, .tabs, .add-pop, .add, .x");
  }
  function reset() { stopRun(false); current = 0; render(); }

  function stopRun(showDoneReset) {
    running = false;
    clearInterval(timer);
    timer = null;
    runBtn.disabled = false;
    setDoneResetVisible(!!showDoneReset);
  }
  function runAlgo() {
    if (running) return;
    setDoneResetVisible(false);
    if (current >= frames.length - 1) current = 0;
    running = true;
    runBtn.disabled = true;
    render();
    timer = setInterval(function () {
      if (current >= frames.length - 1) { stopRun(true); render(); return; }
      current++;
      render();
    }, SPEED_MS);
  }

  function loadCase(i) {
    stopRun(false);
    setAddOpen(false, true);
    activeCaseIdx = i;
    frames = buildFrames(cases[i].nums);
    current = 0;
    renderTabs();
    render();
  }

  function renderTabs() {
    tabs.innerHTML = "";

    var prefix = document.createElement("span");
    prefix.className = "tabs-prefix";
    prefix.textContent = "Test case";
    tabs.appendChild(prefix);

    cases.forEach(function (c, i) {
      var tab = document.createElement("div");
      tab.className = "tab" + (i === activeCaseIdx ? " active" : "");
      tab.setAttribute("role", "button");
      tab.tabIndex = 0;

      var label = document.createElement("span");
  label.textContent = String(i + 1);
      tab.appendChild(label);

      if (c.removable) {
        var x = document.createElement("button");
        x.className = "x";
        x.innerHTML = "&times;";
        x.title = "Remove";
        x.addEventListener("click", function (e) { e.stopPropagation(); removeCase(i); });
        tab.appendChild(x);
      }

      tab.addEventListener("click", function () { loadCase(i); });
      tab.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loadCase(i); }
      });
      tabs.appendChild(tab);
    });

    var addTrigger = document.createElement("button");
    addTrigger.type = "button";
    addTrigger.className = "tab add-trigger" + (addOpen ? " active" : "");
    addTrigger.setAttribute("aria-label", "Add test case");
    addTrigger.textContent = "+";
    addTrigger.addEventListener("click", function () { toggleAddOpen(); });
    tabs.appendChild(addTrigger);
  }

  function addCase() {
    var raw = tcInput.value.trim();
    if (raw === "") { setHint("Type some numbers, e.g. 1,1,2,3", true); return; }
    var tokens = raw.replace(/[\[\]]/g, "").split(/[,\s]+/).filter(function (t) { return t !== ""; });
    var nums = [];
    for (var j = 0; j < tokens.length; j++) {
      if (!/^-?\d+$/.test(tokens[j])) { setHint('"' + tokens[j] + '" is not a whole number.', true); return; }
      nums.push(parseInt(tokens[j], 10));
    }
    if (nums.length === 0) { setHint("Enter at least one number.", true); return; }
    if (nums.length > 60) { setHint("Keep it to 60 numbers or fewer.", true); return; }

    var wasSorted = isSorted(nums);
    if (!wasSorted) nums.sort(function (a, b) { return a - b; });

    cases.push({ nums: nums, removable: true });
    saveCustom();
    setAddOpen(false, true);
    loadCase(cases.length - 1);
    setHint(wasSorted ? "" : "Sorted to [" + nums.join(", ") + "].", false);
  }

  function removeCase(i) {
    var wasActive = i === activeCaseIdx;
    cases.splice(i, 1);
    saveCustom();
    if (activeCaseIdx >= cases.length) activeCaseIdx = cases.length - 1;
    else if (i < activeCaseIdx) activeCaseIdx--;
    if (wasActive) loadCase(activeCaseIdx);
    else renderTabs();
  }

  function isSorted(a) {
    for (var i = 1; i < a.length; i++) if (a[i] < a[i - 1]) return false;
    return true;
  }
  function setHint(msg, isError) {
    hint.textContent = msg;
    hint.style.color = isError ? "var(--cp-danger)" : "var(--cp-text-muted)";
  }

  function loadCustom() {
    try {
      var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(function (a) { return Array.isArray(a) && a.every(function (x) { return typeof x === "number"; }); })
        .map(function (a) { return { nums: a, removable: true }; });
    } catch (e) { return []; }
  }
  function saveCustom() {
    try {
      var custom = cases.filter(function (c) { return c.removable; }).map(function (c) { return c.nums; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(custom));
    } catch (e) {}
  }

  runBtn.addEventListener("click", runAlgo);
  doneResetBtn.addEventListener("click", reset);
  addBtn.addEventListener("click", addCase);
  tcInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addCase(); });
  document.addEventListener("click", function (e) {
    if (shouldIgnoreScreenAdvanceClick(e.target)) return;
    next();
  });

  loadCase(0);
})();
</script>
</body>
</html>
