  <h1><span class="num">28.</span> Find the Index of the First Occurrence in a String</h1>

    <div class="add">
      <input type="text" placeholder="haystack: sadbutsad" autocomplete="off" />
      <input type="text" placeholder="needle: sad" class="small" autocomplete="off" />
      <button id="addBtn">Add</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

    <div class="board" id="board"></div>

    </div>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "lc28_custom_v1";
  var SPEED_MS = 650;


  var defaultCases = [
    { haystack: "sadbutsad", needle: "sad" },
    { haystack: "leetcode", needle: "leeto" },
    { haystack: "hello", needle: "ll" },
    { haystack: "aaaab", needle: "aab" }
  ];

  function parseCase(values) {
    var ph = parseWord(values[0], 20);
    if (ph.error) return { error: "haystack: " + ph.error };
    var pn = parseWord(values[1], 10);
    if (pn.error) return { error: "needle: " + pn.error };
    return { data: { haystack: ph.word, needle: pn.word } };
  }

  function validStored(d) {
    return d && typeof d.haystack === "string" && d.haystack.length > 0 && d.haystack.length <= 20 &&
      typeof d.needle === "string" && d.needle.length > 0 && d.needle.length <= 10;
  }

  function buildFramesBrute(d) {
    var h = d.haystack, nd = d.needle, out = [];
    var n = h.length, m = nd.length;
    function fr(start, j, action, result) {
      return { h: h, nd: nd, start: start, j: j, action: action,
               result: result === undefined ? null : result };
    }
    out.push(fr(0, null, "start"));
    for (var start = 0; start + m <= n; start++) {
      var ok = true;
      for (var j = 0; j < m; j++) {
        out.push(fr(start, j, "look"));
        if (h[start + j] === nd[j]) {
          out.push(fr(start, j, "match"));
        } else {
          out.push(fr(start, j, "mismatch"));
          ok = false;
          break;
        }
      }
      if (ok) {
        out.push(fr(start, null, "found", start));
        return out;
      }
    }
    out.push(fr(null, null, "none", -1));
    return out;
  }

  function renderFrameBrute(f, board) {
    var col = el("div", "viz-col");
    col.appendChild(metaLine(["first occurrence =", { b: f.result === null ? "?" : f.result }]));

    var stack = el("div");
    stack.style.display = "flex";
    stack.style.flexDirection = "column";
    stack.style.alignItems = "flex-start";
    stack.style.gap = "26px";
    stack.style.maxWidth = "100%";
    stack.style.overflowX = "visible";

    stack.appendChild(metaLine(["haystack"]));
    var rowH = el("div", "array-row separated");
    rowH.style.width = "auto";
    rowH.style.justifyContent = "flex-start";
    rowH.style.flexWrap = "nowrap";
    for (var idx = 0; idx < f.h.length; idx++) {
      var cls = [];
      var rel = f.start === null ? null : idx - f.start;
      var inWin = rel !== null && rel >= 0 && rel < f.nd.length;
      if (f.action === "found" && inWin) cls.push("kept");
      if (f.j !== null && rel === f.j) {
        if (f.action === "look") cls.push("comparing");
        else if (f.action === "match") cls.push("writing");
        else if (f.action === "mismatch") cls.push("bad");
      } else if (f.j !== null && inWin && rel < f.j) cls.push("kept");
      rowH.appendChild(makeCell(f.h[idx], idx, cls, []));
    }
    stack.appendChild(rowH);

    stack.appendChild(metaLine(["needle"]));
    var rowN = el("div", "array-row separated");
    rowN.style.width = "auto";
    rowN.style.justifyContent = "flex-start";
    rowN.style.flexWrap = "nowrap";
    var offset = f.start === null ? 0 : f.start;
    rowN.style.marginLeft = "calc(" + offset + " * var(--cell-size))";
    for (var jdx = 0; jdx < f.nd.length; jdx++) {
      var clsN = [];
      if (f.action === "found") clsN.push("kept");
      if (f.j !== null) {
        if (jdx === f.j) {
          if (f.action === "look") clsN.push("comparing");
          else if (f.action === "match") clsN.push("writing");
          else if (f.action === "mismatch") clsN.push("bad");
        } else if (jdx < f.j) clsN.push("kept");
      }
      rowN.appendChild(makeCell(f.nd[jdx], jdx, clsN, []));
    }
    stack.appendChild(rowN);

    col.appendChild(stack);
    board.appendChild(col);
  }

  function buildFramesKmp(d) {
    var h = d.haystack, nd = d.needle, out = [];
    var n = h.length, m = nd.length;
    var lps = new Array(m).fill(0);

    function fr(phase, start, j, action, result, i, len) {
      return {
        h: h,
        nd: nd,
        lps: lps.slice(),
        phase: phase,
        start: start,
        j: j,
        action: action,
        result: result === undefined ? null : result,
        i: i === undefined ? null : i,
        len: len === undefined ? null : len
      };
    }

    lps[0] = 0;
    out.push(fr("lps", null, null, "seed", null, 0, 0));
    for (var p = 1, len = 0; p < m;) {
      out.push(fr("lps", null, null, "compare", null, p, len));
      if (nd[p] === nd[len]) {
        len++;
        lps[p] = len;
        out.push(fr("lps", null, null, "set", null, p, len));
        p++;
      } else if (len !== 0) {
        len = lps[len - 1];
        out.push(fr("lps", null, null, "fallback", null, p, len));
      } else {
        lps[p] = 0;
        out.push(fr("lps", null, null, "setzero", null, p, 0));
        p++;
      }
    }
    out.push(fr("lps", null, null, "ready"));

    var i = 0, j = 0;
    out.push(fr("search", 0, 0, "start"));
    while (i < n) {
      var start = i - j;
      out.push(fr("search", start, j, "look"));
      if (h[i] === nd[j]) {
        i++;
        j++;
        out.push(fr("search", i - j, j === m ? m - 1 : j - 1, "match"));
        if (j === m) {
          out.push(fr("search", i - j, null, "found", i - j));
          return out;
        }
      } else {
        out.push(fr("search", start, j, "mismatch"));
        if (j !== 0) {
          j = lps[j - 1];
          out.push(fr("search", i - j, j, "shift"));
        } else {
          i++;
        }
      }
    }
    out.push(fr("search", null, null, "none", -1));
    return out;
  }

  function renderFrameKmp(f, board) {
    var col = el("div", "viz-col");
    col.appendChild(metaLine(["first occurrence =", { b: f.result === null ? "?" : f.result }]));
    var stepMeta = metaLine([
      { b: f.phase === "lps" ? "Step 1: build lps" : "Step 2: search", cls: "step-slot" },
      "lps =",
      { b: f.lps.join(" "), cls: f.phase === "lps" && f.action === "ready" ? "lps-inline ready-inline" : "lps-inline" }
    ]);
    col.appendChild(stepMeta);

    var stack = el("div");
    stack.style.display = "flex";
    stack.style.flexDirection = "column";
    stack.style.alignItems = "flex-start";
    stack.style.gap = "26px";
    stack.style.maxWidth = "100%";
    stack.style.overflowX = "visible";

    stack.appendChild(metaLine(["haystack"]));
    var rowH = el("div", "array-row separated");
    rowH.style.width = "auto";
    rowH.style.justifyContent = "flex-start";
    rowH.style.flexWrap = "nowrap";
    for (var idx = 0; idx < f.h.length; idx++) {
      var cls = [];
      if (f.phase === "search") {
        var rel = f.start === null ? null : idx - f.start;
        var inWin = rel !== null && rel >= 0 && rel < f.nd.length;
        if (f.action === "found" && inWin) cls.push("kept");
        if (f.j !== null && rel === f.j) {
          if (f.action === "look") cls.push("comparing");
          else if (f.action === "match") cls.push("writing");
          else if (f.action === "mismatch") cls.push("bad");
        } else if (f.j !== null && inWin && rel < f.j) cls.push("kept");
      }
      rowH.appendChild(makeCell(f.h[idx], idx, cls, []));
    }
    stack.appendChild(rowH);

    stack.appendChild(metaLine(["needle"]));
    var rowN = el("div", "array-row separated");
    rowN.style.width = "auto";
    rowN.style.justifyContent = "flex-start";
    rowN.style.flexWrap = "nowrap";
    var offset = (f.phase === "search" && f.start !== null) ? f.start : 0;
    rowN.style.marginLeft = "calc(" + offset + " * var(--cell-size))";
    for (var jdx = 0; jdx < f.nd.length; jdx++) {
      var clsN = [];
      if (f.phase === "search") {
        if (f.action === "found") clsN.push("kept");
        if (f.j !== null) {
          if (jdx === f.j) {
            if (f.action === "look") clsN.push("comparing");
            else if (f.action === "match") clsN.push("writing");
            else if (f.action === "mismatch") clsN.push("bad");
          } else if (jdx < f.j) clsN.push("kept");
        }
      } else {
        if (f.i !== null && jdx < f.i) clsN.push("kept");
        if (f.i !== null && jdx === f.i) {
          if (f.action === "compare") clsN.push("comparing");
          else if (f.action === "set" || f.action === "setzero") clsN.push("writing");
          else if (f.action === "fallback") clsN.push("bad");
        }
      }
      rowN.appendChild(makeCell(f.nd[jdx], jdx, clsN, []));
    }
    stack.appendChild(rowN);

    stack.appendChild(metaLine(["lps"]));
    var rowLps = el("div", "array-row separated");
    rowLps.style.width = "auto";
    rowLps.style.justifyContent = "flex-start";
    rowLps.style.flexWrap = "nowrap";
    for (var lidx = 0; lidx < f.lps.length; lidx++) {
      var clsLps = [];
      if (f.phase === "lps" && f.i !== null && lidx < f.i) clsLps.push("kept");
      if (f.phase === "lps" && f.i !== null && lidx === f.i && (f.action === "set" || f.action === "setzero")) clsLps.push("writing");
      rowLps.appendChild(makeCell(f.lps[lidx], lidx, clsLps, []));
    }
    stack.appendChild(rowLps);

    col.appendChild(stack);
    board.appendChild(col);
  }

  var cases = defaultCases
    .map(function (d) { return { data: d, removable: false }; })
    .concat(loadCustom());

  var frames = [];
  var current = 0;
  var activeCaseIdx = 0;
  var activeAlgo = "brute";
  var running = false;
  var timer = null;

  var algoTabs = document.getElementById("algoTabs");
  var tabs = document.getElementById("tabs");
  var board = document.getElementById("board");
  var runBtn = document.getElementById("runBtn");
  var doneResetBtn = document.getElementById("doneResetBtn");
  var addPop = document.getElementById("addPop");
  var addBtn = document.getElementById("addBtn");
  var hint = document.getElementById("hint");
  var inputs = Array.prototype.slice.call(document.querySelectorAll(".add input"));
  var addOpen = false;

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined && text !== null) d.textContent = String(text);
    return d;
  }

  function makeCell(value, idx, boxClasses, ptrRows) {
    var cell = el("div", "cell");
    var index = el("div", "idx", idx === null || idx === undefined ? "0" : idx);
    if (idx === null || idx === undefined) index.classList.add("idx-spacer");
    cell.appendChild(index);
    var box = el("div", "box", value === null || value === undefined ? "" : value);
    (boxClasses || []).forEach(function (c) { if (c) box.classList.add(c); });
    cell.appendChild(box);
    (ptrRows || []).forEach(function (p) {
      var r = el("div", "ptr");
      if (p) r.appendChild(el("span", "ptr-chip on", p));
      cell.appendChild(r);
    });
    return cell;
  }

  function pastMarker(ptrRows) {
    var cell = el("div", "past-marker");
    var sp = el("div", "idx idx-spacer", "0");
    cell.appendChild(sp);
    cell.appendChild(el("div", "end-gap"));
    (ptrRows || []).forEach(function (p) {
      var r = el("div", "ptr");
      if (p) r.appendChild(el("span", "ptr-chip on", p));
      cell.appendChild(r);
    });
    return cell;
  }

  function metaLine(parts) {
    var m = el("div", "meta");
    parts.forEach(function (p, i) {
      if (i > 0) m.appendChild(document.createTextNode(" "));
      if (p && p.b !== undefined) m.appendChild(el("b", p.cls || null, p.b));
      else m.appendChild(document.createTextNode(String(p)));
    });
    return m;
  }

  function emptyNote(text) { return el("div", "empty-note", text); }

  function parseNums(raw, maxLen) {
    var s = String(raw || "").trim();
    if (s === "") return { error: "Type some numbers, e.g. 1,2,3" };
    var tokens = s.replace(/[\[\]]/g, "").split(/[,\s]+/).filter(function (t) { return t !== ""; });
    var nums = [];
    for (var j = 0; j < tokens.length; j++) {
      if (!/^-?\d+$/.test(tokens[j])) return { error: '"' + tokens[j] + '" is not a whole number.' };
      nums.push(parseInt(tokens[j], 10));
    }
    if (nums.length === 0) return { error: "Enter at least one number." };
    if (nums.length > (maxLen || 60)) return { error: "Keep it to " + (maxLen || 60) + " numbers or fewer." };
    return { nums: nums };
  }

  function parseWord(raw, maxLen, allowEmpty) {
    var s = String(raw || "").trim().replace(/^["']|["']$/g, "");
    if (s === "" && !allowEmpty) return { error: "Type some text." };
    if (s.length > (maxLen || 30)) return { error: "Keep it to " + (maxLen || 30) + " characters or fewer." };
    return { word: s };
  }

  function isIntArray(a, maxLen) {
    return Array.isArray(a) && a.length <= (maxLen || 60) &&
      a.every(function (x) { return typeof x === "number" && isFinite(x) && Math.floor(x) === x; });
  }

  function setDoneResetVisible(show) {
    doneResetBtn.classList.remove("is-hidden");
  }

  function setAddOpen(open, skipRender) {
    addOpen = !!open;
    addPop.hidden = !addOpen;
    if (addOpen) {
      inputs.forEach(function (inp) { inp.value = ""; });
      setHint("", false);
      setTimeout(function () { if (inputs[0]) inputs[0].focus(); }, 0);
    }
    if (!skipRender) renderTabs();
  }

  function toggleAddOpen() {
    setAddOpen(!addOpen);
  }

  function render() {
    board.innerHTML = "";
    if (activeAlgo === "kmp") renderFrameKmp(frames[current], board);
    else renderFrameBrute(frames[current], board);
  }

  function next() {
    if (running) return;
    if (current < frames.length - 1) {
      current++;
      render();
    }
    if (current >= frames.length - 1) setDoneResetVisible(true);
  }

  function shouldIgnoreScreenAdvanceClick(target) {
    return !!target.closest("button, input, .tab, .tabs, .add-pop, .add, .x");
  }
  function reset() { stopRun(false); current = 0; render(); }

  function stopRun(showDoneReset) {
    running = false;
    clearInterval(timer);
    timer = null;
    runBtn.disabled = false;
    setDoneResetVisible(!!showDoneReset);
  }
  function runAlgo() {
    if (running) return;
    setDoneResetVisible(false);
    if (current >= frames.length - 1) current = 0;
    running = true;
    runBtn.disabled = true;
    render();
    timer = setInterval(function () {
      if (current >= frames.length - 1) { stopRun(true); render(); return; }
      current++;
      render();
    }, SPEED_MS);
  }

  function loadCase(i) {
    stopRun(false);
    setAddOpen(false, true);
    activeCaseIdx = i;
    frames = buildFramesForActiveAlgo(cases[i].data);
    current = 0;
    renderAlgoTabs();
    renderTabs();
    render();
  }

  function buildFramesForActiveAlgo(data) {
    return activeAlgo === "kmp" ? buildFramesKmp(data) : buildFramesBrute(data);
  }

  function renderAlgoTabs() {
    algoTabs.innerHTML = "";
    [
      { key: "brute", label: "Brute force" },
      { key: "kmp", label: "KMP" }
    ].forEach(function (item) {
      var tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab" + (activeAlgo === item.key ? " active" : "");
      tab.textContent = item.label;
      tab.addEventListener("click", function () { switchAlgo(item.key); });
      algoTabs.appendChild(tab);
    });
  }

  function switchAlgo(algo) {
    if (algo === activeAlgo) return;
    activeAlgo = algo;
    stopRun(false);
    frames = buildFramesForActiveAlgo(cases[activeCaseIdx].data);
    current = 0;
    renderAlgoTabs();
    render();
  }

  function renderTabs() {
    tabs.innerHTML = "";

    var prefix = document.createElement("span");
    prefix.textContent = "Test case:";
    prefix.style.display = "inline-flex";
    prefix.style.alignItems = "center";
    prefix.style.padding = "10px 12px";
    prefix.style.color = "var(--cp-text)";
    tabs.appendChild(prefix);
    cases.forEach(function (c, i) {
      var tab = document.createElement("div");
      tab.className = "tab" + (i === activeCaseIdx ? " active" : "");
      tab.setAttribute("role", "button");
      tab.tabIndex = 0;

      var label = document.createElement("span");
      label.textContent = String(i + 1);
      tab.appendChild(label);

      if (c.removable) {
        var x = document.createElement("button");
        x.className = "x";
        x.innerHTML = "&times;";
        x.title = "Remove";
        x.addEventListener("click", function (e) { e.stopPropagation(); removeCase(i); });
        tab.appendChild(x);
      }

      tab.addEventListener("click", function () { loadCase(i); });
      tab.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loadCase(i); }
      });
      tabs.appendChild(tab);
    });

    var addTrigger = document.createElement("button");
    addTrigger.type = "button";
    addTrigger.className = "tab add-trigger" + (addOpen ? " active" : "");
    addTrigger.setAttribute("aria-label", "Add test case");
    addTrigger.textContent = "+";
    addTrigger.addEventListener("click", function () { toggleAddOpen(); });
    tabs.appendChild(addTrigger);
  }

  function addCase() {
    var res = parseCase(inputs.map(function (inp) { return inp.value; }));
    if (res.error) { setHint(res.error, true); return; }
    cases.push({ data: res.data, removable: true });
    saveCustom();
    setAddOpen(false, true);
    loadCase(cases.length - 1);
    setHint(res.note || "", false);
  }

  function removeCase(i) {
    var wasActive = i === activeCaseIdx;
    cases.splice(i, 1);
    saveCustom();
    if (activeCaseIdx >= cases.length) activeCaseIdx = cases.length - 1;
    else if (i < activeCaseIdx) activeCaseIdx--;
    if (wasActive) loadCase(activeCaseIdx);
    else renderTabs();
  }

  function setHint(msg, isError) {
    hint.textContent = msg;
    hint.style.color = isError ? "var(--cp-danger)" : "var(--cp-text-muted)";
  }

  function loadCustom() {
    try {
      var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(function (d) { try { return validStored(d); } catch (e) { return false; } })
        .map(function (d) { return { data: d, removable: true }; });
    } catch (e) { return []; }
  }
  function saveCustom() {
    try {
      var custom = cases.filter(function (c) { return c.removable; }).map(function (c) { return c.data; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(custom));
    } catch (e) {}
  }

  runBtn.addEventListener("click", runAlgo);
  doneResetBtn.addEventListener("click", reset);
  addBtn.addEventListener("click", addCase);
  inputs.forEach(function (inp) {
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") addCase(); });
  });
  document.addEventListener("click", function (e) {
    if (shouldIgnoreScreenAdvanceClick(e.target)) return;
    next();
  });

  loadCase(0);
})();
</script>
</body>
</html>
